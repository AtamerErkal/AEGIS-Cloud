# =============================================================================
# AEGIS-Cloud — Edge Configuration (Production-Ready)
# =============================================================================
# File:      edge/config/edge_settings.yaml
# Platform: NVIDIA Jetson Nano (JetPack 5.x)
#
# DESIGN PRINCIPLES
# -----------------
# • SIMULATION_MODE=true: safe default — no hardware required for CI/CD.
# • All hardware-dependent modules MUST read this file before any I/O.
# • AIOps thresholds feed the Cloud self_healing_service.py.
# • NATO_METADATA provides geographic context for Incident Reports.
# =============================================================================

# ---------------------------------------------------------------------------
# GLOBAL FLAGS
# ---------------------------------------------------------------------------
simulation_mode: true          # true = use sim data; false = live hardware
log_level: "INFO"              # DEBUG | INFO | WARNING | ERROR | CRITICAL
nato_log_format: true          # Enforce NATO Incident Report log lines

# ---------------------------------------------------------------------------
# INFERENCE  (YOLOv8 Vision Node)
# ---------------------------------------------------------------------------
inference:
  model_path: "edge/models/yolov8n.onnx"  # ONNX backend (no PyTorch) | swap to .pt for ultralytics
  nms_iou_threshold: 0.45                     # Non-max suppression IoU cutoff
  target_classes:                             # Maritime scenario: surface vessel detection only
    - "ship"
    - "boat"
  device: "cuda"                              # "cuda" | "cpu" | "0" (GPU idx)
  image_size: 640                             # Inference resolution (px)
  confidence_threshold: 0.35                  # Lowered for maritime — vessels at distance/horizon harder to detect
  grad_cam_enabled: true                      # XAI: generate heatmap stubs
  grad_cam_trigger: "Hostile"                 # Only generate for risk level
  # Simulation sources
  sim_video_path: "data/videos/test_drone.mp4"
  sim_fallback_color: [0, 128, 255]           # BGR placeholder frame colour
  target_fps: 5                               # 5 FPS for video file scanning (faster than live reasoning mode)
  # Best-frame selection: accumulate detections over a window, snapshot the peak frame
  best_frame_window_s: 5.0                    # Seconds to collect frames before picking best
  snapshot_dir: "data/logs/snapshots"         # Directory for saved best-frame JPEGs

# ---------------------------------------------------------------------------
# CAMERA  (IMX219 / Sony v2 CSI — Jetson Nano GStreamer pipeline)
# ---------------------------------------------------------------------------
# Set use_gstreamer: true ONLY after the IMX219 hardware is physically
# connected and calibrated. While false, live mode falls back to the
# simulation video path (hardware-free CI/CD is preserved).
# ---------------------------------------------------------------------------
camera:
  use_gstreamer: false           # HARDWARE FLAG — flip to true on camera arrival
  sensor_id: 0                   # CSI port index (0 = primary)
  capture_width: 1920            # IMX219 native capture width (px)
  capture_height: 1080           # IMX219 native capture height (px)
  output_width: 640              # Downscaled output width fed to YOLOv8 (px)
  output_height: 360             # Downscaled output height fed to YOLOv8 (px)
  framerate: 30                  # Camera framerate (fps)
  flip_method: 0                 # nvvidconv: 0=none, 2=180°, 4=horiz-flip
  drop_frames: true              # appsink: drop stale frames under load

# ---------------------------------------------------------------------------
# REASONING  (Moondream Multimodal LLM via Ollama)
# ---------------------------------------------------------------------------
# Moondream is a 1.6B-parameter vision-language model optimised for
# resource-constrained edge devices such as the Jetson Nano 4GB.
#
# Pull the model once:  ollama pull moondream
# ---------------------------------------------------------------------------
reasoning:
  ollama_endpoint: "http://localhost:11434"   # Local Ollama server
  model_name: "moondream"                     # Ollama model tag after pull
  timeout_seconds: 90                         # 90s max — if no answer by then, skip and retry next window
  max_retries: 3                              # Circuit-breaker trip threshold
  cooldown_seconds: 60                        # Seconds before circuit-breaker auto-probes Ollama
  # Moondream native res is 378px; 128px crop is enough for vessel type + threat level
  image_resize_px: 128                        # Smaller crop = faster encode + faster VLM inference
  options:
    temperature: 0                            # Fully deterministic — no sampling overhead
    num_predict: 35                           # TYPE+THREAT+NOTES fits in 35 tokens

# ---------------------------------------------------------------------------
# SENSORS  (Fusion Engine / Driver Interface)
# ---------------------------------------------------------------------------
sensors:
  sample_rate_hz: 100
  imu:
    i2c_bus: 1
    i2c_address: 0x69          # ICM-20948 default address
    sim_trace_path: "data/sim_samples/imu_trace.csv"
  tof:
    i2c_bus: 1
    i2c_address: 0x29          # VL6180X default address
    sim_trace_path: "data/sim_samples/tof_trace.csv"

# ---------------------------------------------------------------------------
# CLOUD SYNC  (Azure IoT Hub Gateway)
# ---------------------------------------------------------------------------
cloud_sync:
  iot_hub_connection_env: "AEGIS_IOT_HUB_CONN_STR"  # Env var holding conn str
  telemetry_interval_seconds: 1
  retry_max_attempts: 5
  retry_backoff_base_seconds: 2
  sim_output_path: "data/logs/sim_cloud_sync.jsonl"
  sim_commands_path: "data/sim_samples/c2d_commands.json"

# ---------------------------------------------------------------------------
# SERVO / PAN-TILT GIMBAL  (PCA9685 — pan channel 0, tilt channel 1)
# ---------------------------------------------------------------------------
# Set simulation_mode: false AND wire PCA9685 to I²C bus 1 (addr 0x40)
# to activate real servo control.  In simulation mode all angle commands
# are logged but no I²C writes are issued.
#
# PD Tuning guide:
#   kp  — increase for faster response, decrease if oscillating
#   kd  — increase to dampen overshoot
#   deadzone_norm — fraction of frame width/height treated as "on target"
#                   (0.03 = target within ±3 % of centre → no movement)
# ---------------------------------------------------------------------------
servo:
  i2c_address: 0x40             # PCA9685 default I²C address
  frequency_hz: 50              # Standard RC servo PWM frequency
  pan_channel: 0                # PCA9685 output channel for pan servo
  tilt_channel: 1               # PCA9685 output channel for tilt servo
  pan_center_deg: 90.0          # Absolute home angle for pan  (0–180°)
  tilt_center_deg: 90.0         # Absolute home angle for tilt (0–180°)
  pan_range_deg: [-90, 90]      # Offset limits from pan_center_deg
  tilt_range_deg: [-45, 45]     # Offset limits from tilt_center_deg
  pid:
    kp: 0.4                     # Proportional gain (degrees per normalised error)
    kd: 0.05                    # Derivative gain
    deadzone_norm: 0.03         # ±3 % of frame — no servo movement below this

# ---------------------------------------------------------------------------
# MOTOR / PLATFORM  (Self-Healing Targets — consumed by Cloud)
# ---------------------------------------------------------------------------
motor:
  speed_min_rpm: 200
  speed_max_rpm: 8000
  vibration_safe_threshold_g: 2.5   # G-force RMS — triggers safe-mode above

# ---------------------------------------------------------------------------
# AIOPS  (Health Monitoring & Telemetry)
# ---------------------------------------------------------------------------
aiops:
  hardware_check_interval: 2.0       # Seconds between hardware health polls
  temp_threshold: 75                 # °C — alert if SoC temp exceeds this
  vibration_limit: 2.5               # G-force limit mirrors motor threshold
  telemetry_buffer_path: "data/logs/"
  anomaly_alert_threshold: 3         # Consecutive anomalies before escalation
  health_check_interval_seconds: 10

# ---------------------------------------------------------------------------
# NATO METADATA  (Incident Report Context)
# ---------------------------------------------------------------------------
nato_metadata:
  station_id: "AEGIS-MARITIME-001"
  unit_designation: "AEGIS-DRONE-MARITIME-PATROL-1"
  unit_coordinates:                  # WGS-84 — Eastern Aegean Sea patrol zone
    lat: 37.9150                     # Aegean Sea, approx. between Chios and Izmir
    lon: 26.3400
    alt_m: 120.0                     # Drone patrol altitude (m AGL)
  classification_level: "UNCLASSIFIED//FOR TRAINING ONLY"
  reporting_format: "STANAG-4586-STUB"
  scenario: "MARITIME_SURVEILLANCE"  # Active mission type