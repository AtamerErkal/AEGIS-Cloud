# =============================================================================
# AEGIS-Cloud — MLOps / Deploy / OpenShift Deployment Manifest
# =============================================================================
# Platform:  Kubernetes / OpenShift (Minikube for simulation)
#
# PURPOSE
# -------
# Combined Deployment + Service manifest for simulating the AEGIS Cloud
# runtime on a local Minikube or OpenShift cluster.  This enables the
# Diehl Defence team to validate the full edge-to-cloud pipeline in a
# controlled, air-gapped environment before Azure deployment.
#
# DESIGN NOTES
# ------------
# • The Deployment runs the Podmanfile.cloud container image.
# • Secrets are mounted from a Kubernetes Secret (not shown — create
#   separately with `kubectl create secret`).
# • Liveness probe hits the Azure Functions health endpoint.
# • Resource limits are set conservatively for Minikube simulation.
# • The Service exposes port 80 for internal cluster communication
#   and NodePort 30080 for local development access.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-cloud-reasoning
  namespace: aegis-system
  labels:
    app: aegis-cloud
    component: reasoning
    tier: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-cloud
      component: reasoning
  template:
    metadata:
      labels:
        app: aegis-cloud
        component: reasoning
    spec:
      containers:
        - name: threat-evaluator
          image: aegis-cloud/cloud-runtime:0.1.0-skeleton
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: aegis-cloud-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: logs-volume
              mountPath: /data/logs
      volumes:
        - name: logs-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-cloud-reasoning-svc
  namespace: aegis-system
  labels:
    app: aegis-cloud
    component: reasoning
spec:
  type: NodePort
  selector:
    app: aegis-cloud
    component: reasoning
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
